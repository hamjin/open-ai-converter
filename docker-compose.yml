services:
  openai-converter:
    build: .
    container_name: openai-converter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - type: bind
        source: ./.env
        target: /app/.env
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
