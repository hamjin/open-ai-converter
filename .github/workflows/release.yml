name: Release

on:
  push:
    tags:
      - "**"

env:
  BINARY_NAME: openai-converter
  GO_VERSION: "1.23"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    name: Build release binaries
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Build binaries
        run: |
          mkdir -p dist

          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/${BINARY_NAME}-linux-amd64" .
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/${BINARY_NAME}-linux-arm64" .
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/${BINARY_NAME}-darwin-amd64" .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/${BINARY_NAME}-darwin-arm64" .
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o "dist/${BINARY_NAME}-windows-amd64.exe" .

          cd dist
          sha256sum * > checksums.txt

      - name: Upload release binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/
          retention-days: 7

  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v5
        with:
          name: release-binaries
          path: dist

      - name: Set release tag
        run: echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Dockerfile
        run: |
          cat > Dockerfile.ci <<'EOF'
          FROM alpine:3.19
          RUN apk --no-cache add ca-certificates tzdata
          WORKDIR /app
          ARG TARGETARCH
          COPY dist/openai-converter-linux-${TARGETARCH} openai-converter
          EXPOSE 9090
          CMD ["./openai-converter"]
          EOF

      - name: Build and push amd64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file Dockerfile.ci \
            --tag "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            --push \
            .

      - name: Build and push arm64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            --file Dockerfile.ci \
            --tag "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}-arm64" \
            --push \
            .

      - name: Create and push multi-arch manifests
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}" \
            "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}-arm64"

          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}-amd64" \
            "${REGISTRY}/${IMAGE_NAME}:${RELEASE_TAG}-arm64"

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs:
      - build
      - docker
    permissions:
      contents: write

    steps:
      - name: Download release binaries
        uses: actions/download-artifact@v5
        with:
          name: release-binaries
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Downloads

            | Platform | Architecture | File |
            |----------|-------------|------|
            | Linux | x86_64 | `${{ env.BINARY_NAME }}-linux-amd64` |
            | Linux | ARM64 | `${{ env.BINARY_NAME }}-linux-arm64` |
            | macOS | Intel | `${{ env.BINARY_NAME }}-darwin-amd64` |
            | macOS | Apple Silicon | `${{ env.BINARY_NAME }}-darwin-arm64` |
            | Windows | x86_64 | `${{ env.BINARY_NAME }}-windows-amd64.exe` |
          files: |
            dist/${{ env.BINARY_NAME }}-linux-amd64
            dist/${{ env.BINARY_NAME }}-linux-arm64
            dist/${{ env.BINARY_NAME }}-darwin-amd64
            dist/${{ env.BINARY_NAME }}-darwin-arm64
            dist/${{ env.BINARY_NAME }}-windows-amd64.exe
            dist/checksums.txt
